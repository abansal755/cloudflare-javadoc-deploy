name: CI
on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    security-events: write

jobs:
    update-lambda:
        name: Update AWS Lambda Function
        if: >-
            ${{ github.event_name != 'push' || !(
              contains(github.event.head_commit.message, 'SKIP CI')
            ) }}
        runs-on: ubuntu-latest
        env:
            AWS_REGION: ${{ vars.AWS_REGION }}
            AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
            IMAGE_NAME: cloudflare-javadoc-deploy
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: "21"
                cache: maven

            - name: Build project
              run: mvn -B -ntp package

            - name: Setup AWS Credentials
              run: |
                  aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws configure set region $AWS_REGION

            - name: Update AWS Lambda Function
              run: | 
                  aws lambda update-function-code \
                  --function-name cloudflare_javadoc_deploy_zip \
                  --zip-file fileb://target/cloudflare-javadoc-deploy-0.0.1-SNAPSHOT.jar \
                  --publish

    trivy-code-scanning:
        runs-on: ubuntu-latest
        name: Trivy Code Scanning
        if: >-
            ${{ github.event_name != 'push' || !(
              contains(github.event.head_commit.message, 'SKIP CI')
            ) }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Run Trivy (table output)
                uses: aquasecurity/trivy-action@0.35.0
                with:
                    scan-type: 'fs'
                    scan-ref: '.'
                    severity: CRITICAL,HIGH,MEDIUM
                    scanners: vuln,secret
                    format: 'table'
                env:
                    TRIVY_TABLE_MODE: summary

            -   name: Run Trivy (generate SARIF)
                uses: aquasecurity/trivy-action@0.35.0
                with:
                    scan-type: 'fs'
                    scan-ref: '.'
                    severity: CRITICAL,HIGH,MEDIUM
                    scanners: vuln,secret
                    format: 'sarif'
                    output: 'report.sarif'

            -   name: Upload results to GitHub Code Scanning
                uses: github/codeql-action/upload-sarif@v4
                with:
                    sarif_file: report.sarif
                    category: trivy

    codeql-code-scanning:
        name: CodeQL Code Scanning
        runs-on: ubuntu-latest
        if: >-
            ${{ github.event_name != 'push' || !(
              contains(github.event.head_commit.message, 'SKIP CI')
            ) }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Set up JDK 17
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: '21'
                    cache: maven

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: java-kotlin
                    build-mode: manual

            -   name: Maven Build
                run: mvn -B -ntp package

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
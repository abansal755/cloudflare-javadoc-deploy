name: CI
on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        if: >-
            ${{ github.event_name != 'push' || !(
              contains(github.event.head_commit.message, 'SKIP CI')
            ) }}
        runs-on: ubuntu-latest
        env:
            AWS_REGION: ${{ vars.AWS_REGION }}
            AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
            IMAGE_NAME: cloudflare-javadoc-deploy
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: "21"
                cache: maven

            - name: Build project
              run: mvn -B -ntp clean compile

            - name: Setup AWS Credentials
              run: |
                  aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws configure set region $AWS_REGION

            - name: Login to Amazon ECR
              run: |
                  aws ecr get-login-password --region $AWS_REGION \
                  | docker login --username AWS \
                  --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

            - name: Build and Push Docker Image
              run: |
                  docker buildx build --platform linux/amd64 --provenance=false -t $IMAGE_NAME ./
                  docker tag $IMAGE_NAME $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:latest
                  docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:latest

            - name: Update AWS Lambda Function
              run: | 
                  aws lambda update-function-code \
                  --function-name cloudflare_javadoc_deploy \
                  --image-uri $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:latest \
                  --publish \
                  --query 'FunctionArn' \
                  --output text
